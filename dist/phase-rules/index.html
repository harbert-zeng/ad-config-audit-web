<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阶段规则 · 广告配置检查</title><link rel="stylesheet" href="style.css"></head><body><div style="position:fixed;bottom:0;left:0;right:0;z-index:99999;padding:6px 12px;background:#fff2bf;color:#624300;text-align:center;font:13px sans-serif">分享版 · 默认数据全部为虚构示例 · 未连接真实广告账户</div><header><a href="/">← 返回接入配置</a><strong>广告配置检查 · 阶段规则</strong><a href="/first-day/">首日报告</a></header><main><div id="context"></div><div class="title"><span class="eyebrow">把阶段要求说清楚，留下可检查的规则</span><h1>这个阶段，有什么特别要求？</h1><p>写允许和禁止出现的词。先确认范围与日期，再检查广告文案。</p></div><div class="layout"><section class="conversation"><h2>和规则助手聊一聊</h2><div id="messages" role="log" aria-live="polite"></div><form id="chat"><label for="message">阶段要求</label><textarea id="message" rows="5" placeholder="例如：阶段：黑五预热；允许使用“Early Black Friday”；禁止使用“Last chance”和“Ends tonight”。"></textarea><div class="actions"><button type="button" id="example" class="secondary">填入黑五示例</button><button type="submit">整理成规则</button></div></form><p class="muted">本版支持明确关键词，不自动理解折扣是否合理或外语语义。未识别的要求会保留为备注。</p></section><section class="review"><h2>确认后才纳入检查</h2><div id="draft"><div class="empty">先在左边写下阶段要求。<br>这里会显示可修改的规则确认卡。</div></div></section></div><section><h2>已确认的阶段规则</h2><p class="muted">规则按当前账户保存。不同范围同时命中时，禁用要求优先；允许某个词不代表整条广告合规。</p><div id="rules"></div></section><section id="results" hidden></section><div id="error" role="alert"></div></main><script type="module" src="app.js?v=20261118"></script></body></html>
